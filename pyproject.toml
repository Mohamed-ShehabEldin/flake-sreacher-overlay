[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flake-searcher-overlay"
version = "0.1.0.dev0"
description = "Microscope overlay with validated XY stage control and flake detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy==2.4.3",
    "opencv-python==4.13.0.92",
    "pillow==12.1.1",
    "pyautogui==0.9.54",
    "pyqt5==5.15.11",
    "pyserial==3.5",
]

[project.optional-dependencies]
detector = [
    "tensorflow==2.21.0",
]
full = [
    "tensorflow==2.21.0",
    "scikit-learn==1.8.0",
    "setuptools==84.0.0",
    "tqdm==4.67.3",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "sam-2 @ https://github.com/facebookresearch/sam2/archive/2b90b9f5ceec907a1c18123530e92e794ad901a4.tar.gz",
]

[project.scripts]
flake-searcher = "flake_searcher.main_window:main"

[tool.setuptools.packages.find]
include = ["flake_searcher*"]

[tool.setuptools.package-data]
flake_searcher = ["ui/*.ui"]

[tool.uv]
package = true
no-build-isolation-package = ["sam-2"]

[tool.uv.extra-build-dependencies]
sam-2 = ["setuptools==84.0.0", "torch==2.10.0"]
